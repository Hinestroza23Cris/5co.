  }
  @keyframes kenburns {
    from { transform: scale(1)    translateY(0); }
    to   { transform: scale(1.18) translateY(-3%); }
  }

  /* Capa oscura + toque neón sutil para que todo se lea bien */
  .veil {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(0,255,65,.10), transparent 55%),
      linear-gradient(to bottom, rgba(18,18,18,.55), rgba(18,18,18,.78) 55%, rgba(18,18,18,.92));
  }

  /* ---------- Contenido ---------- */
  .container {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 1px solid var(--neon);
    object-fit: cover;
    background: #1a1a1a;
    margin-bottom: 20px;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .subtitle {
    margin-top: 2px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--muted);
  }

  .links {
    width: 100%;
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 16px 20px;
    background: rgba(18,18,18,.6);
    color: var(--text);
    text-decoration: none;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: border-color .25s ease, background-color .25s ease, box-shadow .25s ease;
  }
  .btn:hover,
  .btn:focus-visible {
    border-color: var(--neon);
    background: rgba(0, 255, 65, 0.05);
    box-shadow: 0 0 14px rgba(0, 255, 65, 0.35);
    outline: none;
  }

  .social {
    margin-top: 22px;
    display: flex;
    justify-content: center;
    gap: 14px;
  }
  .icon-btn {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    background: rgba(18,18,18,.6);
    border: 1px solid var(--border);
    border-radius: 50%;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: border-color .25s ease, background-color .25s ease, box-shadow .25s ease;
  }
  .icon-btn:hover,
  .icon-btn:focus-visible {
    border-color: var(--neon);
    background: rgba(0, 255, 65, 0.05);
    box-shadow: 0 0 14px rgba(0, 255, 65, 0.35);
    outline: none;
  }

  .foot {
    margin-top: 32px;
    font-size: 0.6rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .bg::before { animation: none; }
  }
</style>
</head>
